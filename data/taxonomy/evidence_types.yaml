# NYC Tenant Evidence Types — curated taxonomy
# These are concrete, obtainable proof types tenants can present.
# how_to_obtain: brief note on how to get this evidence

- id: hpd_violation_record
  name: HPD Violation Record
  description: Official NYC Housing Preservation and Development record of open violations on the property.
  jurisdiction: NYC
  status: canonical
  aliases:
    - HPD violations
    - HPD open violations
    - HPD Violation Records
  how_to_obtain: Search HPD Online (hpd.nyc.gov/check-my-building)

- id: hpd_inspection_report
  name: HPD Inspection Report
  description: Written report from an HPD inspector documenting conditions observed during inspection.
  jurisdiction: NYC
  status: canonical
  aliases:
    - inspection report
    - HPD inspector notes
    - Inspection Reports
    - Inspection Reports (e.g., HPD, DOB)
  how_to_obtain: Request after filing an HPD complaint or HP action

- id: dhcr_rent_registration
  name: DHCR Rent Registration
  description: Official DHCR record showing registered rent for the unit over time.
  jurisdiction: NYC
  status: canonical
  aliases:
    - rent registration history
    - DHCR registration
    - Rent Stabilization Application
  how_to_obtain: Request via DHCR (hcr.ny.gov) or subpoena in proceeding

- id: dhcr_rent_history
  name: DHCR Rent History
  description: Complete DHCR rent history for the apartment showing all registered legal rents.
  jurisdiction: NYC
  status: canonical
  aliases:
    - apartment rent history
    - Lease and Vacancy Documents
    - Previous Tenant Rent Information
    - Rent History
    - Rent Threshold Records
    - Vacancy Decontrol Records
  how_to_obtain: Request from DHCR or through attorney via FOIL

- id: lease_agreement
  name: Lease Agreement
  description: Signed lease or renewal lease showing agreed rent, term, and conditions.
  jurisdiction: NYC
  status: canonical
  aliases:
    - lease
    - rental agreement
    - First Lease for Rent Stabilized Tenants
    - Lease Agreements
    - Lease or Written Contract
    - Most Recent Lease for Market Tenants
    - Prior Lease Agreements
    - Rent Regulated Lease
    - Signed Rental Agreement
    - Written Lease Agreement
  how_to_obtain: Tenant keeps original; request copy from landlord

- id: rent_receipts
  name: Rent Receipts / Payment Records
  description: Proof of rent payments made — checks, money order stubs, bank statements, app records.
  jurisdiction: NYC
  status: canonical
  aliases:
    - payment records
    - rent payment history
    - rent ledger
    - Money Orders
    - Receipts
    - Rent Receipts and Ledgers
    - Rent Receipts
    - Rent Receipts and Cancelled Checks
    - Rent Receipts and Payment Records
    - Rent Receipts or Canceled Checks
    - Rent Receipts or Cancelled Checks
    - Rent Receipts or Ledger
    - Rent Receipts or Ledgers
    - Rent Receipts or Payment Proof
    - Rent Receipts or Payment Records
  how_to_obtain: Gather from bank records, money order stubs, or payment app exports

- id: written_notice_to_landlord
  name: Written Notice to Landlord
  description: Tenant's written complaint or notice sent to landlord about conditions or violations.
  jurisdiction: NYC
  status: canonical
  aliases:
    - notice letter
    - tenant complaint letter
    - Certified Mail Letter to Landlord
    - Certified Mail Notices
    - Complaint Correspondence
    - Complaint Letters
    - Complaint to Landlord
    - Correspondence and Complaints
    - Correspondence with Landlord
    - Tenant Complaint Letters
    - Tenant Correspondence and Complaints
    - Written Complaints to Landlord
    - Written Notices to Landlord
    - Letter of Complaint
    - Notice of Defects to Landlord
    - Complaints to Landlord
  how_to_obtain: Tenant creates; send certified mail and retain copy

- id: 311_complaint_record
  name: 311 Complaint Record
  description: NYC 311 service request confirmation for complaints made about housing conditions.
  jurisdiction: NYC
  status: canonical
  aliases:
    - 311 service request
    - 311 complaint
    - Complaint to Government Agency
    - Government Agency Complaints
    - HPD Complaint Record
  how_to_obtain: Search nyc.gov/311 with service request number

- id: photos_video_conditions
  name: Photos or Video of Conditions
  description: Timestamped photos or video documenting hazardous or substandard conditions.
  jurisdiction: NYC
  status: canonical
  aliases:
    - photographic evidence
    - condition photos
    - Heating System Device Evidence
    - Photographs of Conditions
    - Apartment Photos
    - Photographs and Videos
    - Photographs or Video of Conditions
    - Photographs or Videos
    - Photos and Text Messages
  how_to_obtain: Tenant documents; metadata timestamps preferred

- id: repair_request_communications
  name: Repair Request Communications
  description: Emails, texts, or letters from tenant requesting repairs from landlord.
  jurisdiction: NYC
  status: canonical
  aliases:
    - repair requests
    - maintenance requests
    - Repair Requests and Correspondence
    - Repair Request Logs
    - Repair Request Log
  how_to_obtain: Tenant retains copies of all communications

- id: landlord_non_response_evidence
  name: Evidence of Landlord Non-Response
  description: Documentation showing landlord received notice but failed to act within a reasonable time.
  jurisdiction: NYC
  status: canonical
  aliases:
    - proof of non-response
    - certified mail return receipt
    - Certified Mail Receipt
  how_to_obtain: Certified mail return receipts; screenshots showing read/no response

- id: medical_records
  name: Medical Records
  description: Medical documentation linking health conditions to housing hazards (lead, mold, pests, etc.).
  jurisdiction: NYC
  status: canonical
  aliases:
    - doctor's records
    - health records
  how_to_obtain: Request from treating physician; may require release form

- id: dob_violation_record
  name: DOB Violation Record
  description: NYC Department of Buildings violation record on the property.
  jurisdiction: NYC
  status: canonical
  aliases:
    - DOB violations
    - buildings department violations
  how_to_obtain: Search DOB NOW (a-b.nyc.gov) by address

- id: certificate_of_occupancy
  name: Certificate of Occupancy
  description: DOB record of the building's legal occupancy classification.
  jurisdiction: NYC
  status: canonical
  aliases:
    - CO
    - C of O
  how_to_obtain: Search DOB BIS or DOB NOW

- id: prior_court_orders
  name: Prior Court Orders / Stipulations
  description: Orders from prior housing court proceedings requiring specific repairs or actions.
  jurisdiction: NYC
  status: canonical
  aliases:
    - court stipulation
    - prior order
    - Housing Court Filings
  how_to_obtain: Tenant retains; clerk of court if lost

- id: witness_affidavits
  name: Witness Affidavits
  description: Sworn statements from neighbors or others corroborating conditions or events.
  jurisdiction: NYC
  status: canonical
  aliases:
    - neighbor affidavit
    - witness statement
    - Tenant and Witness Testimony
    - Witness Testimony
  how_to_obtain: Obtained from willing witnesses; notarized

- id: contractor_estimates
  name: Contractor Estimates / Repair Invoices
  description: Written estimates or invoices from contractors showing cost and scope of needed repairs.
  jurisdiction: NYC
  status: canonical
  aliases:
    - repair estimate
    - contractor quote
  how_to_obtain: Obtain from licensed contractors

- id: building_sale_documents
  name: Building Sale / Transfer Documents
  description: Deed, sale contract, or other documents showing building ownership transfer.
  jurisdiction: NYC
  status: canonical
  aliases:
    - deed
    - transfer documents
  how_to_obtain: NYC ACRIS (acris.nyc.gov)

- id: original_apartment_registration
  name: Original Apartment Registration
  description: The first DHCR registration for the apartment establishing base rent.
  jurisdiction: NYC
  status: canonical
  aliases:
    - initial registration
  how_to_obtain: DHCR records request

- id: preferential_rent_rider
  name: Preferential Rent Rider
  description: Lease rider explicitly stating the legal regulated rent alongside the preferential (lower) rent charged.
  jurisdiction: NYC
  status: canonical
  aliases:
    - preferential rent agreement
  how_to_obtain: Should be attached to lease; request from landlord

- id: dhcr_order_determination
  name: DHCR Order or Determination
  description: Official DHCR order in a prior proceeding (overcharge, MCI, IAI, etc.).
  jurisdiction: NYC
  status: canonical
  aliases:
    - DHCR determination
    - DHCR order
    - DHCR Deregulation Orders
    - DHCR Determination Order
  how_to_obtain: Copy kept by tenant; request from DHCR

- id: succession_cohabitation_proof
  name: Proof of Co-habitation for Succession
  description: Documents showing co-occupancy with the named tenant for the required succession period (2 years; 1 year for family).
  jurisdiction: NYC
  status: canonical
  aliases:
    - cohabitation evidence
    - succession documents
  how_to_obtain: Utility bills, bank statements, mail, driver's license at address

- id: harassment_incident_log
  name: Harassment Incident Log
  description: Contemporaneous written record of harassing conduct by landlord or agents, with dates and details.
  jurisdiction: NYC
  status: canonical
  aliases:
    - incident log
    - harassment log
    - Evidence of Harassing Conduct
    - Harassment Logs
    - Photos or Videos of Harassment
    - Tenant Complaint Records
    - Harassment Complaint or Record
  how_to_obtain: Tenant creates ongoing diary; corroborate with texts/emails

- id: landlord_buyout_offer
  name: Buyout Offer Documentation
  description: Written buyout offer from landlord, relevant to harassment or destabilization claims.
  jurisdiction: NYC
  status: canonical
  aliases:
    - buyout letter
    - cash-for-keys offer
  how_to_obtain: Retain all written communications; note oral offers in log

- id: hpd_emergency_declaration
  name: HPD Emergency Declaration
  description: HPD order declaring emergency conditions requiring immediate correction.
  jurisdiction: NYC
  status: canonical
  aliases:
    - emergency repair order
    - HPD emergency

- id: expert_report
  name: Expert / Engineer Report
  description: Report by a licensed engineer, architect, or other expert documenting conditions.
  jurisdiction: NYC
  status: canonical
  aliases:
    - engineering report
    - inspection expert
    - Bedbug Inspection Report
    - Expert Inspection Report
  how_to_obtain: Retained by tenant or counsel

- id: rent_increase_notices
  name: Rent Increase Notices
  description: All notices from landlord notifying tenant of rent increases.
  jurisdiction: NYC
  status: canonical
  aliases:
    - rent increase letter
    - RN-26 Notice
  how_to_obtain: Tenant retains; request copies from landlord

- id: lease_non_renewal_notice
  name: Lease Non-Renewal Notice
  description: Written notice from landlord refusing to renew the lease.
  jurisdiction: NYC
  status: canonical
  aliases:
    - non-renewal notice

- id: predicate_notice
  name: Predicate Notice
  description: Required statutory notice before landlord may commence eviction (notice to cure, notice of termination, etc.).
  jurisdiction: NYS
  status: canonical
  aliases:
    - cure notice
    - termination notice
    - notice to quit

- id: marshal_eviction_notice
  name: Marshal's Notice / Eviction Notice
  description: Notice from city marshal informing tenant of a scheduled eviction.
  jurisdiction: NYC
  status: canonical
  aliases:
    - marshal notice
    - eviction notice
    - Notice of Eviction

- id: security_deposit_receipt
  name: Security Deposit Receipt
  description: Written receipt showing amount of security deposit collected.
  jurisdiction: NYS
  status: canonical
  aliases:
    - deposit receipt

- id: bank_itemization_letter
  name: Security Deposit Itemization Letter
  description: Landlord's written itemization of deductions from security deposit sent within statutory deadline.
  jurisdiction: NYS
  status: canonical
  aliases:
    - itemization letter
    - deposit deduction notice

- id: mci_application_record
  name: MCI Application Record
  description: DHCR records for a major capital improvement application, including approval and effective date.
  jurisdiction: NYC
  status: canonical
  aliases:
    - MCI records
    - capital improvement application
    - MCI Cost Documentation

- id: iai_documentation
  name: IAI Documentation
  description: Records supporting an individual apartment improvement rent increase (invoices, work orders).
  jurisdiction: NYC
  status: canonical
  aliases:
    - IAI records
    - improvement invoices
    - Apartment Improvement Records

- id: building_permit_records
  name: Building Permit Records
  description: DOB permits issued for work on the building or unit — useful to verify or challenge IAI/MCI claims.
  jurisdiction: NYC
  status: canonical
  aliases:
    - DOB permits
    - permit history

- id: heatline_complaint_record
  name: Heat Complaint Record (Heatline)
  description: NYC heat complaint filed with 311 or HPD during the heating season.
  jurisdiction: NYC
  status: canonical
  aliases:
    - heat complaint
    - heatline record

- id: lead_xrf_test_results
  name: Lead XRF Test Results
  description: Results of X-ray fluorescence testing for lead paint in the unit.
  jurisdiction: NYC
  status: canonical
  aliases:
    - lead test
    - XRF results

- id: mold_test_results
  name: Mold Assessment / Test Results
  description: Professional mold assessment report or test results.
  jurisdiction: NYC
  status: canonical
  aliases:
    - mold test
    - mold inspection

- id: rent_demand_letter
  name: Rent Demand Letter
  description: Formal demand letter from landlord claiming unpaid rent before commencing non-payment proceeding.
  jurisdiction: NYS
  status: canonical
  aliases:
    - rent demand
    - three-day notice
    - Court Papers or Demand Letter
    - Rent Breakdown from Landlord

# ── Promoted from bootstrap proposals (atlas06 audit, applied atlas08) ──

- id: medical_letter_disability
  name: Medical Letter for Disability Accommodation
  description: A letter from a medical provider stating the tenant has a disability and needs a specific accommodation (e.g., an air conditioning unit), supporting a reasonable accommodation request.
  jurisdiction: NYC
  status: canonical
  aliases: []

- id: outside_temp_records
  name: Outside Temperature Records
  description: Official weather data showing the outside temperature fell below 55°F during the day, which triggers the 68°F daytime indoor minimum. The 62°F night minimum applies regardless of outside temperature.
  jurisdiction: NYC
  status: canonical
  aliases: []

- id: proof_of_future_rent_ability
  name: Proof of Ability to Pay Future Rent
  description: Evidence showing sufficient income to pay future rent, such as a job, third-party support, or public benefits.
  jurisdiction: NYC
  status: canonical
  aliases: []

- id: public_assistance_docs
  name: Public Assistance Documents
  description: Papers from public assistance, Section 8, or other rental assistance programs that help pay rent, used as evidence.
  jurisdiction: NYC
  status: canonical
  aliases:
    - Commitment Letters
    - Public Assistance Breakdown
    - Public Assistance Case Documents

- id: tax_abatement_records
  name: Tax Abatement Records
  description: Government records showing J-51 or 421-a tax benefits for a building, indicating rent stabilization eligibility.
  jurisdiction: NYC
  status: canonical
  aliases: []

- id: temperature_logs
  name: Temperature Logs
  description: Records of indoor temperature readings taken at various times and locations within the dwelling unit.
  jurisdiction: NYC
  status: canonical
  aliases:
    - Hot Water Temperature Measurements
    - Temperature Readings

- id: utility_bills
  name: Utility Bills
  description: Bills for electricity, gas, or other utilities in the tenant's name at the unit; standard proof of primary residence and of co-residence in succession claims.
  jurisdiction: NYC
  status: canonical
  aliases: []
  how_to_obtain: Download past statements from the utility account (e.g., Con Edison, National Grid)

# --- bootstrap proposals (status: proposed) ---
- id: building_ownership_records
  name: Building Ownership Records
  description: Information from WhoOwnsWhat or similar sources to identify building
    ownership and coverage status.
  jurisdiction: NYC
  status: canonical
  aliases:
    - Landlord Name and Address
    - Property Records from ACRIS
    - Who Owns What Data
- id: complaint_to_nycch
  name: Complaint to NYC Commission on Human Rights
  description: A formal complaint filed with the NYC Commission on Human Rights regarding
    discrimination or failure to provide reasonable accommodation.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: court_order_of_protection
  name: Court Order of Protection
  description: A legal order from a court protecting a tenant, used to support a domestic
    violence lease termination.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: dwelling_condition_report
  name: Dwelling Condition Report
  description: A report by two qualified employees following a personal inspection
    finding that a dwelling endangers life, health, or safety.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: fraud_evidence
  name: Evidence of Fraud
  description: Documents or testimony showing that the landlord made false statements
    or engaged in deceptive practices to deregulate a unit.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: explanation_of_rent_arrears_cause
  name: Explanation of Rent Arrears Cause
  description: A statement explaining why the tenant fell behind on rent, such as
    job loss, reduced hours, or medical crisis.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: income_threshold_records
  name: Income Threshold Records
  description: Documentation of tenant or household income to determine if high-income
    decontrol applied.
  jurisdiction: NYS
  status: proposed
  aliases:
    - Tax Return Income Proof
- id: landlord_letters_emails
  name: Landlord Letters or Emails
  description: Written correspondence from the landlord that may evidence harassment.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: overcharge_calculation
  name: Overcharge Calculation
  description: A computation showing the difference between the rent paid and the
    legal regulated rent, used to prove an overcharge.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: pay_stubs
  name: Pay Stubs
  description: Recent pay stubs (6 weeks) for every member of the household to prove
    income.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: proof_of_30_day_residence
  name: Proof of 30-Day Residence
  description: Evidence that the roommate has lived in the unit for at least 30 days,
    such as mail, utility bills, or witness statements.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: proof_of_disability_or_elderly_status
  name: Proof of Disability or Elderly Status
  description: Documentation showing a tenant is disabled or elderly, which can be
    sent to the marshal to delay eviction.
  jurisdiction: NYC
  status: proposed
  aliases:
    - Proof of Senior Status
- id: surrender_letter
  name: Surrender Letter
  description: A written notice to the landlord stating the tenant has vacated and
    surrendered possession of the apartment.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: written_agreement_to_end_lease
  name: Written Agreement to End Lease
  description: A signed, notarized document from the landlord agreeing to terminate
    the lease early.
  jurisdiction: NYC
  status: proposed
  aliases: []