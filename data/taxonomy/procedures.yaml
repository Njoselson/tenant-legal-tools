# NYC Tenant Procedural Paths — curated taxonomy
# filing_body: the agency, court, or body where the proceeding is initiated
# typical_duration: rough timeline for tenant planning

- id: hp_action
  name: HP Action (Housing Part)
  description: Housing court proceeding initiated by tenant to compel landlord to make repairs and correct violations.
  jurisdiction: NYC
  status: canonical
  aliases:
    - HP proceeding
    - housing part action
    - order to correct
  filing_body: NYC Housing Court — Housing Part
  typical_duration: 1–6 months

- id: dhcr_overcharge_complaint
  name: DHCR Overcharge Complaint
  description: Tenant files a rent overcharge complaint with DHCR seeking refund of overcharged amounts and penalties.
  jurisdiction: NYC
  status: canonical
  aliases:
    - overcharge complaint
    - DHCR overcharge
  filing_body: NYS Division of Housing and Community Renewal (DHCR)
  typical_duration: 1–3 years

- id: dhcr_harassment_complaint
  name: DHCR Harassment Complaint
  description: Tenant files a harassment complaint with DHCR based on landlord conduct intended to force out a rent-stabilized tenant.
  jurisdiction: NYC
  status: canonical
  aliases:
    - harassment complaint DHCR
  filing_body: NYS Division of Housing and Community Renewal (DHCR)
  typical_duration: 6–24 months

- id: housing_court_nonpayment
  name: Housing Court — Non-Payment Proceeding
  description: Landlord-initiated proceeding to collect unpaid rent; tenant may assert affirmative defenses (warranty of habitability, overcharge, etc.).
  jurisdiction: NYC
  status: canonical
  aliases:
    - non-payment proceeding
    - non-pay
  filing_body: NYC Housing Court
  typical_duration: 2–6 months

- id: housing_court_holdover
  name: Housing Court — Holdover Proceeding
  description: Landlord-initiated proceeding to recover possession of the apartment (lease expiration, non-primary residence, etc.).
  jurisdiction: NYC
  status: canonical
  aliases:
    - holdover proceeding
    - holdover eviction
  filing_body: NYC Housing Court
  typical_duration: 3–12 months

- id: dhcr_lease_renewal_complaint
  name: DHCR Lease Renewal Complaint
  description: Tenant files with DHCR when landlord refuses to offer or improperly conditions a rent-stabilized lease renewal.
  jurisdiction: NYC
  status: canonical
  aliases:
    - renewal complaint
  filing_body: NYS Division of Housing and Community Renewal (DHCR)
  typical_duration: 6–18 months

- id: hpd_complaint
  name: HPD Complaint (311)
  description: Administrative complaint filed with HPD via 311 to trigger an inspection of housing conditions.
  jurisdiction: NYC
  status: canonical
  aliases:
    - 311 complaint
    - HPD complaint
  filing_body: NYC HPD via 311
  typical_duration: Days to weeks (inspection scheduling)

- id: article_78_proceeding
  name: Article 78 Proceeding
  description: Special proceeding in NY Supreme Court to challenge a final administrative determination (e.g., adverse DHCR order).
  jurisdiction: NYS
  status: canonical
  aliases:
    - Article 78
    - CPLR 78
  filing_body: NY Supreme Court
  typical_duration: 6–18 months

- id: nyc_commission_human_rights
  name: CCHR Discrimination Complaint
  description: Complaint filed with the NYC Commission on Human Rights for housing discrimination.
  jurisdiction: NYC
  status: canonical
  aliases:
    - human rights complaint
    - CCHR complaint
  filing_body: NYC Commission on Human Rights
  typical_duration: 6–24 months

- id: small_claims_court
  name: Small Claims Court
  description: Tenant files in small claims court for monetary damages (e.g., security deposit, overcharge) up to $10,000.
  jurisdiction: NYS
  status: canonical
  aliases:
    - small claims
  filing_body: NYC Civil Court — Small Claims Part
  typical_duration: 2–4 months

- id: emergency_order_to_show_cause
  name: Emergency Order to Show Cause (OSC)
  description: Tenant or attorney seeks emergency relief from housing court judge, typically to stop an eviction or compel emergency repairs.
  jurisdiction: NYC
  status: canonical
  aliases:
    - OSC
    - emergency motion
  filing_body: NYC Housing Court
  typical_duration: Days

- id: succession_proceeding
  name: Succession Proceeding / Claim
  description: Proceeding (or defense in holdover) asserting right to succeed to a rent-stabilized lease.
  jurisdiction: NYC
  status: canonical
  aliases:
    - succession claim
    - succession defense
  filing_body: NYC Housing Court (typically as holdover defense) or DHCR
  typical_duration: 6–18 months

- id: dhcr_mci_challenge
  name: DHCR MCI Challenge
  description: Tenant challenge to a Major Capital Improvement rent increase application or order before DHCR.
  jurisdiction: NYC
  status: canonical
  aliases:
    - MCI challenge
    - MCI objection
  filing_body: NYS Division of Housing and Community Renewal (DHCR)
  typical_duration: 1–3 years

- id: dob_complaint
  name: DOB Complaint
  description: Complaint filed with NYC Department of Buildings for illegal construction, unsafe conditions, or illegal conversion.
  jurisdiction: NYC
  status: canonical
  aliases:
    - DOB complaint
    - buildings complaint
  filing_body: NYC Department of Buildings
  typical_duration: Days to weeks (inspection scheduling)

- id: attorney_general_complaint
  name: Attorney General Complaint (Condo/Co-op Conversion)
  description: Complaint filed with the NY Attorney General's office regarding a condo/co-op conversion plan.
  jurisdiction: NYS
  status: canonical
  aliases:
    - AG complaint
    - conversion plan challenge
  filing_body: NYS Office of the Attorney General
  typical_duration: 6–24 months
