  jurisdiction: NYC
  status: proposed
  aliases: []
- id: photos_videos_harassment
  name: Photos or Videos of Harassment
  description: Visual evidence capturing acts of harassment by the landlord.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: previous_tenant_rent_info
  name: Previous Tenant Rent Information
  description: Information about the rent paid by the prior tenant, which can help
