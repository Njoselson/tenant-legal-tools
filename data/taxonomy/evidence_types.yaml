  jurisdiction: NYS
  status: proposed
  aliases:
  - Apartment Photos
  - Photographs and Videos
  - Photographs or Video of Conditions
  - Photographs or Videos
- id: photos_and_text_messages
  name: Photos and Text Messages
  description: Visual or written evidence of the conditions, such as photos of defects
