  jurisdiction: NYC
  status: proposed
  aliases: []
- id: lease_agreements
  name: Lease Agreements
  description: Copies of all leases, including initial and renewal leases, to prove
    rent history and stabilization status.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: lease_and_vacancy_documents
  name: Lease and Vacancy Documents
  description: Leases, vacancy notices, or rent ledgers that document the rent at
    vacancy and whether it exceeded the high rent deregulation threshold.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: lease_or_written_contract
  name: Lease or Written Contract
  description: A lease or other written contract that may modify owner responsibilities
    for one- or two-family dwellings.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: letter_of_complaint
  name: Letter of Complaint
  description: A formal written notice to the landlord detailing repair issues and
    potential legal consequences, used to demonstrate notice.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: mci_cost_documentation
  name: MCI Cost Documentation
  description: Records of major capital improvement costs and allocation, used to
    challenge improper rent increases.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: medical_letter_disability
  name: Medical Letter for Disability Accommodation
  description: A letter from a medical clinician stating that a tenant has a disability
    requiring an air conditioning unit, used to support a reasonable accommodation
    request.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: money_orders
  name: Money Orders
  description: Money order receipts or copies as proof of rent payment.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: most_recent_lease_market
  name: Most Recent Lease for Market Tenants
  description: The most recent lease (even if expired) for non-stabilized tenants,
    which governs rules about air conditioning.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: notice_of_defects_to_landlord
  name: Notice of Defects to Landlord
  description: Written or documented communication from the tenant to the landlord
    informing them of specific conditions that violate the warranty of habitability.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: outside_temp_records
  name: Outside Temperature Records
  description: Official weather data showing outside temperature fell below the trigger
    thresholds (55°F daytime, 40°F nighttime).
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: overcharge_calculation
  name: Overcharge Calculation
  description: A computation showing the difference between the rent paid and the
    legal regulated rent, used to prove an overcharge.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: pay_stubs
  name: Pay Stubs
  description: Recent pay stubs (6 weeks) for every member of the household to prove
    income.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: photographs_of_conditions
  name: Photographs of Conditions
  description: Visual documentation of the physical condition of the premises, such
