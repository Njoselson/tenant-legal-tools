# NYC Tenant Claim Types — curated taxonomy
# Slug IDs: lowercase_underscores, ≤30 chars
# jurisdiction: NYC (city law applies) | NYS (state law only)
# status: canonical | proposed

- id: rent_overcharge
  name: Rent Overcharge
  description: Landlord charges rent above the legally permitted amount for a rent-stabilized unit.
  jurisdiction: NYC
  status: canonical
  aliases:
    - overcharge
    - rent overcharge claim
    - Excessive Rent Increase
    - Illegal Rent Increase
    - Unlawful Rent Increase
    - Unlawful Air Conditioning Fees

- id: rent_stabilization_violation
  name: Rent Stabilization Violation
  description: Landlord violates rent stabilization rules (improper increases, failure to renew lease, etc.) short of full deregulation.
  jurisdiction: NYC
  status: canonical
  aliases:
    - RSC violation
    - Failure to Renew Lease

- id: deregulation_challenge
  name: Deregulation Challenge
  description: Tenant challenges improper removal of unit from rent stabilization coverage.
  jurisdiction: NYC
  status: canonical
  aliases:
    - illegal deregulation
    - deregulation challenge

- id: high_rent_vacancy_challenge
  name: High-Rent Vacancy Challenge
  description: Tenant challenges decontrol based on high-rent vacancy where the unit did not qualify.
  jurisdiction: NYC
  status: canonical
  aliases:
    - HRVC
    - high rent vacancy decontrol

- id: habitability_violation
  name: Habitability Violation
  description: Unit conditions violate the implied warranty of habitability — heat, hot water, mold, structural defects, pests.
  jurisdiction: NYC
  status: canonical
  aliases:
    - warranty of habitability
    - unsafe conditions
    - lack of heat
    - mold
    - habitability violation for mold
    - Failure to Provide Essential Services
    - Heat Violation
    - Hot Water Violation
    - Repair Neglect

- id: good_cause_eviction_defense
  name: Good Cause Eviction Defense
  description: >-
    Tenant in a non-rent-stabilized unit asserts Good Cause Eviction Act
    coverage as an affirmative defense to a nonpayment or holdover proceeding
    — landlord must plead and prove the unit is exempt or that a valid § 216
    ground exists; rent increases above the Local Rent Standard are
    presumptively unreasonable absent landlord rebuttal.
  jurisdiction: NYS
  status: canonical
  aliases:
    - Good Cause Eviction
    - GCE defense
    - good cause defense

- id: hp_action_repairs
  name: HP Action — Repairs
  description: Housing court HP proceeding compelling landlord to make required repairs.
  jurisdiction: NYC
  status: canonical
  aliases:
    - housing part action
    - HP proceeding
    - order to correct
    - Emergency HP Action
    - Group HP Action

- id: breach_warranty_habitability
  name: Breach of Warranty of Habitability
  description: Civil claim for rent abatement or damages where landlord fails to maintain habitable conditions.
  jurisdiction: NYS
  status: canonical
  aliases:
    - warranty of habitability breach
    - WOH
    - Rent Abatement

- id: harassment
  name: Landlord Harassment
  description: Landlord engages in conduct intended to force tenant out of rent-stabilized unit.
  jurisdiction: NYC
  status: canonical
  aliases:
    - tenant harassment
    - landlord harassment

- id: illegal_lockout
  name: Illegal Lockout
  description: Landlord unlawfully locks tenant out of their unit without a court order.
  jurisdiction: NYS
  status: canonical
  aliases:
    - unlawful lockout
    - lockout
    - Illegal Eviction (Self-Help Eviction)
    - Unlawful Self-Help Eviction
    - Unlawful Eviction
    - Wrongful Eviction
    - Illegal Eviction of Roommate
    - Unlawful Eviction Claim

- id: retaliatory_eviction
  name: Retaliatory Eviction
  description: Landlord retaliates against tenant for exercising a legal right (e.g., complaining to HPD, organizing).
  jurisdiction: NYS
  status: canonical
  aliases:
    - retaliation
    - retaliatory action

- id: security_deposit_return
  name: Security Deposit Return
  description: Landlord fails to return security deposit within the statutory deadline.
  jurisdiction: NYS
  status: canonical
  aliases:
    - deposit return
    - security deposit claim

- id: security_deposit_violation
  name: Security Deposit Violation
  description: Landlord violates rules governing collection, holding, or use of security deposits.
  jurisdiction: NYS
  status: canonical
  aliases:
    - deposit violation

- id: constructive_eviction
  name: Constructive Eviction
  description: Conditions are so severe that the tenant is effectively forced to vacate.
  jurisdiction: NYS
  status: canonical
  aliases:
    - constructive eviction claim

- id: housing_discrimination
  name: Housing Discrimination
  description: Discrimination in housing based on protected class (race, national origin, disability, source of income, etc.).
  jurisdiction: NYC
  status: canonical
  aliases:
    - discrimination
    - fair housing violation
    - Fair Housing Act Discrimination

- id: improper_service
  name: Improper Service
  description: Legal papers were not served in compliance with statutory requirements.
  jurisdiction: NYS
  status: canonical
  aliases:
    - defective service
    - service of process defect
    - improper service defense

- id: procedural_defect
  name: Procedural Defect
  description: A procedural error that may invalidate a legal proceeding (e.g., improper predicate notice).
  jurisdiction: NYS
  status: canonical
  aliases:
    - defective notice
    - procedural challenge

- id: succession_rights
  name: Succession Rights
  description: Family member or co-occupant asserts right to succeed to a rent-stabilized lease after the named tenant vacates or dies.
  jurisdiction: NYC
  status: canonical
  aliases:
    - lease succession
    - succession claim
    - succession rights violation

- id: primary_residence_challenge
  name: Primary Residence Challenge
  description: Tenant contests landlord's claim that the unit is not tenant's primary residence.
  jurisdiction: NYC
  status: canonical
  aliases:
    - primary residence

- id: preferential_rent_dispute
  name: Preferential Rent Dispute
  description: Dispute over landlord's right to restore rent to the legal regulated rent after charging a preferential rate.
  jurisdiction: NYC
  status: canonical
  aliases:
    - preferential rent

- id: owner_use_eviction
  name: Owner-Use / Immediate Family Use
  description: Landlord seeks to recover unit for personal use or use by an immediate family member.
  jurisdiction: NYC
  status: canonical
  aliases:
    - owner occupancy
    - owner use eviction

- id: illegal_apartment
  name: Illegal Apartment
  description: Unit lacks required certificates of occupancy or is otherwise illegally converted.
  jurisdiction: NYC
  status: canonical
  aliases:
    - illegal conversion
    - no CO

- id: condo_coop_conversion
  name: Condo / Co-op Conversion
  description: Landlord converts building to condo or co-op while tenant claims protections under conversion plan.
  jurisdiction: NYC
  status: canonical
  aliases:
    - conversion eviction
    - non-eviction plan

- id: lead_paint_violation
  name: Lead Paint Violation
  description: Landlord fails to remediate lead paint hazards in units with children under 6.
  jurisdiction: NYC
  status: canonical
  aliases:
    - lead hazard
    - lead paint

- id: mci_challenge
  name: MCI Rent Increase Challenge
  description: Tenant challenges a Major Capital Improvement rent increase granted to landlord.
  jurisdiction: NYC
  status: canonical
  aliases:
    - MCI challenge
    - major capital improvement dispute

- id: iae_challenge
  name: IAE / IAI Rent Increase Challenge
  description: Tenant challenges an Individual Apartment Enhancement or Individual Apartment Improvement rent increase.
  jurisdiction: NYC
  status: canonical
  aliases:
    - IAI challenge
    - individual apartment improvement dispute

# ── Promoted from bootstrap proposals (atlas06 audit, applied atlas08) ──

- id: breach_of_quiet_enjoyment
  name: Breach of Quiet Enjoyment
  description: A claim that the landlord substantially interfered with the tenant's right to use and enjoy the rental property peacefully.
  jurisdiction: NYS
  status: canonical
  aliases: []

- id: failure_to_provide_reasonable_accommodation
  name: Failure to Provide Reasonable Accommodation
  description: Landlord's failure to provide reasonable accommodation to tenants with disabilities, which is a form of discrimination.
  jurisdiction: NYC
  status: canonical
  aliases:
    - Disability Accommodation for Air Conditioning

- id: fair_market_rent_appeal
  name: Fair Market Rent Appeal
  description: A tenant's right to challenge the initial rent set at the start of rent stabilization, seeking a refund if the rent increased excessively.
  jurisdiction: NYS
  status: canonical
  aliases: []

- id: fraudulent_deregulation
  name: Fraudulent Deregulation
  description: A claim that a landlord improperly removed a unit from rent stabilization through fraud, such as false statements about vacancy or improvements.
  jurisdiction: NYS
  status: canonical
  aliases:
    - Fraudulent Rent Registration

- id: service_reduction
  name: Service Reduction
  description: A claim that a landlord decreased essential building or apartment services, violating rent stabilization obligations.
  jurisdiction: NYS
  status: canonical
  aliases:
    - Failure to Maintain Cooling System
    - Failure to Maintain Services
    - Rent Freeze and Reduction

# --- bootstrap proposals (status: proposed) ---
- id: breach_of_lease
  name: Breach of Lease
  description: A claim that a landlord violated the terms of a lease agreement, such
    as failing to provide essential services or maintain the premises.
  jurisdiction: NYS
  status: proposed
  aliases:
  - Breach of Contract
  - Landlord Breach of Contract
- id: challenge_rent_increase
  name: Challenge Rent Increase
  description: A claim that a rent-controlled tenant can challenge a landlord's application
    for a rent increase due to uncorrected violations or failure to provide essential
    services.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: criminal_harassment
  name: Criminal Harassment
  description: Conduct that impairs habitability, endangers safety or health, or causes
    physical injury to a tenant or third person. Intentionally harassing a rent-regulated
    tenant (threats, repeated interruption of services, or other conduct intended to
    force vacatur) is a specific instance of this offense under Penal Law § 241.05.
  jurisdiction: NYS
  status: proposed
  aliases:
    - harassment of a rent regulated tenant
- id: domestic_violence_lease_termination
  name: Domestic Violence Lease Termination
  description: A right for tenants with a court order of protection to break a lease
    if safety is jeopardized, with ten days' notice.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: failure_to_register
  name: Failure to Register Apartment
  description: A claim that the landlord failed to file required rent registration
    statements with DHCR, affecting rent stabilization status.
  jurisdiction: NYS
  status: proposed
  aliases:
  - Failure to Register Rent
  - Failure to Register as Rent Stabilized
- id: lease_violation
  name: Lease Violation
  description: A claim that a landlord failed to comply with lease terms or rent stabilization
    requirements regarding lease offers or renewals.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: military_lease_termination
  name: Military Lease Termination
  description: A right for tenants entering active military service to break a lease
    with proper notice.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: negligent_maintenance
  name: Negligent Maintenance
  description: A claim that the landlord negligently failed to repair or maintain
    the property, causing harm to the tenant.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: relocation_services_claim
  name: Relocation Services Claim
  description: A claim by a displaced tenant for relocation services such as information
    on vacant accommodations and registration facilities.
  jurisdiction: NYC
  status: proposed
  aliases:
  - Relocation Payment Claim
- id: retaliation_for_housing_court_action
  name: Retaliation for Prior Housing Court Action
  description: Unlawful for a building owner to refuse to rent to a tenant because
    of prior action against the tenant in Housing Court.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: senior_lease_termination
  name: Senior Lease Termination
  description: A right for tenants aged 62 or older to break a lease under specific
    circumstances, such as relocation to senior housing or medical necessity.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: tenant_rights_roommate
  name: Tenant Rights for Roommates
  description: A roommate who has lived in the unit for at least 30 days or has a
    signed rental agreement has tenancy rights and cannot be evicted without proper
    legal process.
  jurisdiction: NYC
  status: proposed
  aliases: []