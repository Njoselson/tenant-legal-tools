  - Written Notices to Landlord
- id: complaint_to_government_agency
  name: Complaint to Government Agency
  description: A written or recorded complaint made by the tenant to a government
    agency, such as HPD or DHCR, regarding housing code violations or rent issues.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: complaint_to_nycch
  name: Complaint to NYC Commission on Human Rights
  description: A formal complaint filed with the NYC Commission on Human Rights regarding
    discrimination or failure to provide reasonable accommodation.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: court_decision
  name: Court Decision
  description: A judicial ruling, such as from the Appellate Division or Court of
    Appeals, that establishes or clarifies legal rights in a housing case.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: court_order_of_protection
  name: Court Order of Protection
  description: A legal order from a court protecting a tenant, used to support a domestic
    violence lease termination.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: court_papers_or_demand_letter
  name: Court Papers or Demand Letter
  description: Any court papers or a demand letter from the landlord showing the rent
    owed.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: dhcr_deregulation_orders
  name: DHCR Deregulation Orders
  description: Orders from the DHCR authorizing deregulation based on rent or income
    thresholds.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: dhcr_determination_order
  name: DHCR Determination Order
  description: A written decision by DHCR on a rent overcharge or service complaint,
    including findings and calculations.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: documents_money_orders_applications
  name: Documents, Money Orders, Applications
  description: General evidence such as documents, money orders, applications, receipts,
    commitment letters, or breakdowns from public assistance to support an order to
    show cause.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: dwelling_condition_report
  name: Dwelling Condition Report
  description: A report by two qualified employees following a personal inspection
    finding that a dwelling endangers life, health, or safety.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: eviction_notices
  name: Eviction Notices
  description: Written notices served by the landlord to the tenant, such as a rent
    demand or notice to quit, which may be evidence in an unlawful eviction claim.
  jurisdiction: NYC
  status: proposed
  aliases:
  - Eviction Notice
  - Notice of Eviction
- id: fraud_evidence
  name: Evidence of Fraud
  description: Documents or testimony showing that the landlord made false statements
    or engaged in deceptive practices to deregulate a unit.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: evidence_of_harassing_conduct
  name: Evidence of Harassing Conduct
  description: Records of threats, repeated service interruptions, or other actions
    intended to disturb the tenant's quiet enjoyment, such as emails, letters, or
    witness statements.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: expert_inspection_report
  name: Expert Inspection Report
  description: A report from a qualified inspector or engineer documenting the presence
    of mold, structural issues, or other defects.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: explanation_of_rent_arrears_cause
  name: Explanation of Rent Arrears Cause
  description: A statement explaining why the tenant fell behind on rent, such as
    job loss, reduced hours, or medical crisis.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: first_lease_rent_stabilized
  name: First Lease for Rent Stabilized Tenants
  description: The initial lease governing a rent-stabilized tenancy, which may contain
    rules about air conditioning installation and fees.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: government_agency_complaints
  name: Government Agency Complaints
  description: Records of complaints filed with government agencies such as HPD or
    HCR.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: hpd_complaint_record
  name: HPD Complaint Record
  description: A record of a complaint made to the NYC Department of Housing Preservation
    and Development (HPD) via 311, documenting repair issues.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: hpd_violation_records
  name: HPD Violation Records
  description: Official records from the NYC Department of Housing Preservation and
    Development documenting building code violations, which can support claims of
    habitability breaches or harassment.
  jurisdiction: NYC
  status: proposed
  aliases:
  - HPD Violation Record
  - HPD Violations
- id: harassment_logs
  name: Harassment Logs
  description: Personal records or logs documenting incidents of harassment by the
    landlord.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: heating_system_device_evidence
  name: Heating System Device Evidence
  description: Photographs, videos, or inspection reports showing a device that disables
    or limits the heating system.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: hot_water_temp_measurements
  name: Hot Water Temperature Measurements
  description: Records of hot water temperature at fixtures, showing failure to maintain
    120°F (or 110°F with certain valves).
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: housing_court_filings
  name: Housing Court Filings
  description: Court documents from prior or related housing court proceedings, such
    as HP actions or eviction cases.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: income_threshold_records
  name: Income Threshold Records
  description: Documentation of tenant or household income to determine if high-income
    decontrol applied.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: inspection_reports
  name: Inspection Reports
  description: Reports from official inspections (e.g., by HPD or a court-appointed
    expert) documenting the physical condition of the premises.
  jurisdiction: NYC
  status: proposed
  aliases:
  - Inspection Reports (e.g., HPD, DOB)
- id: landlord_letters_emails
  name: Landlord Letters or Emails
  description: Written correspondence from the landlord that may evidence harassment.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: landlord_name_and_address
  name: Landlord Name and Address
  description: The legal name and address of the landlord, required to file an HP
