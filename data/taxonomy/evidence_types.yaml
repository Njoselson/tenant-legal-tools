  jurisdiction: NYC
  status: proposed
  aliases: []
- id: relocation_payment_schedule
  name: Relocation Payment Schedule
  description: The official schedule of payments for relocation, including maximum
    or minimum amounts, approved by the mayor.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: rent_breakdown_from_landlord
  name: Rent Breakdown from Landlord
  description: A breakdown from the landlord showing the months and amount of rent
    you owe.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: rgb_guidelines
  name: Rent Guidelines Board Increases
  description: Official RGB annual adjustment rates for rent-stabilized lease renewals,
    used to verify lawful increases.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: rent_history
  name: Rent History
  description: A record of a tenant's rent history, which can be used to verify rent
    stabilization status and support claims.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: rent_receipts_and_ledgers
  name: Rent Receipts and Ledgers
  description: Documents showing rent payments made by the tenant, including receipts,
    canceled checks, or landlord ledger entries, used to prove rent overcharge or
    payment history.
  jurisdiction: NYS
  status: proposed
  aliases:
  - Rent Receipts
  - Rent Receipts and Cancelled Checks
  - Rent Receipts and Payment Records
  - Rent Receipts or Canceled Checks
  - Rent Receipts or Cancelled Checks
  - Rent Receipts or Ledger
  - Rent Receipts or Ledgers
  - Rent Receipts or Payment Proof
  - Rent Receipts or Payment Records
- id: rent_regulated_lease
  name: Rent Regulated Lease
  description: A lease showing the legal regulated rent for a rent-stabilized unit,
    relevant to determining if the rent threshold for decontrol is met.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: rent_stabilization_application
  name: Rent Stabilization Application
  description: The official application or registration form filed with the DHCR or
    city agency that documents a unit's rent stabilization status.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: rent_threshold_records
  name: Rent Threshold Records
  description: Documentation showing the legal regulated rent at vacancy or over time
    to determine if high-rent vacancy deregulation applied.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: repair_request_logs
  name: Repair Request Logs
  description: Written or electronic records of tenant requests for repairs, including
    dates and responses (or lack thereof).
  jurisdiction: NYS
  status: proposed
  aliases:
  - Repair Request Log
- id: signed_rental_agreement
  name: Signed Rental Agreement
  description: A written agreement between the roommate and the prime tenant that
    establishes tenancy rights.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: state_issued_id
  name: State-Issued Photo Identification
  description: A government-issued ID required for in-person requests for rent history
    at DHCR borough offices.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: surrender_letter
  name: Surrender Letter
  description: A written notice to the landlord stating the tenant has vacated and
    surrendered possession of the apartment.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: tax_abatement_records
  name: Tax Abatement Records
  description: Government records showing J-51 or 421-a tax benefits for a building,
    indicating rent stabilization eligibility.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: tax_return_income_proof
  name: Tax Return Income Proof
  description: Tax returns or other income documentation used to establish a tenant's
    household income for high income decontrol purposes.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: temperature_logs
  name: Temperature Logs
  description: Records of indoor temperature readings taken at various times and locations
    within the dwelling unit.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: temperature_readings
  name: Temperature Readings
  description: Records of indoor temperature measurements, relevant to heat or habitability
    claims.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: tenant_complaint_records
  name: Tenant Complaint Records
  description: Copies of complaints made to the landlord or authorities regarding
    the harassing behavior.
  jurisdiction: NYS
  status: proposed
  aliases:
  - Complaints to Landlord
  - Harassment Complaint or Record
- id: tenant_witness_testimony
  name: Tenant and Witness Testimony
  description: Oral or written statements from tenants or witnesses about harassment
    incidents.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: utility_bills
  name: Utility Bills
  description: Bills for utilities such as electricity, gas, or water, which may show
    whether services were interrupted or improperly charged.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: vacancy_decontrol_records
  name: Vacancy Decontrol Records
  description: Records showing whether the unit was subject to vacancy decontrol or
    luxury deregulation.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: who_owns_what_data
  name: Who Owns What Data
  description: Data from JustFix's Who Owns What tool showing registered rent-stabilized
    units and changes over time.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: witness_testimony
  name: Witness Testimony
  description: Oral statements from tenants, neighbors, or others with personal knowledge
    of the conditions or events, given under oath.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: written_agreement_to_end_lease
  name: Written Agreement to End Lease
  description: A signed, notarized document from the landlord agreeing to terminate
    the lease early.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: written_lease_agreement
  name: Written Lease Agreement
  description: A written agreement with the landlord for at least one year, required
    for unregulated apartments to get FHEPS.
  jurisdiction: NYC
  status: proposed
  aliases: []
