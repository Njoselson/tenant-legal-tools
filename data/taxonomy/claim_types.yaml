# NYC Tenant Claim Types — curated taxonomy
# Slug IDs: lowercase_underscores, ≤30 chars
# jurisdiction: NYC (city law applies) | NYS (state law only)
# status: canonical | proposed

- id: rent_overcharge
  name: Rent Overcharge
  description: Landlord charges rent above the legally permitted amount for a rent-stabilized unit.
  jurisdiction: NYC
  status: canonical
  aliases:
    - overcharge
    - rent overcharge claim

- id: rent_stabilization_violation
  name: Rent Stabilization Violation
  description: Landlord violates rent stabilization rules (improper increases, failure to renew lease, etc.) short of full deregulation.
  jurisdiction: NYC
  status: canonical
  aliases:
    - RSC violation

- id: deregulation_challenge
  name: Deregulation Challenge
  description: Tenant challenges improper removal of unit from rent stabilization coverage.
  jurisdiction: NYC
  status: canonical
  aliases:
    - illegal deregulation
    - deregulation challenge

- id: high_rent_vacancy_challenge
  name: High-Rent Vacancy Challenge
  description: Tenant challenges decontrol based on high-rent vacancy where the unit did not qualify.
  jurisdiction: NYC
  status: canonical
  aliases:
    - HRVC
    - high rent vacancy decontrol

- id: habitability_violation
  name: Habitability Violation
  description: Unit conditions violate the implied warranty of habitability — heat, hot water, mold, structural defects, pests.
  jurisdiction: NYC
  status: canonical
  aliases:
    - warranty of habitability
    - unsafe conditions
    - lack of heat
    - mold
    - habitability violation for mold

- id: good_cause_eviction_defense
  name: Good Cause Eviction Defense
  description: >-
    Tenant in a non-rent-stabilized unit asserts Good Cause Eviction Act
    coverage as an affirmative defense to a nonpayment or holdover proceeding
    — landlord must plead and prove the unit is exempt or that a valid § 216
    ground exists; rent increases above the Local Rent Standard are
    presumptively unreasonable absent landlord rebuttal.
  jurisdiction: NYS
  status: canonical
  aliases:
    - Good Cause Eviction
    - GCE defense
    - good cause defense

- id: hp_action_repairs
  name: HP Action — Repairs
  description: Housing court HP proceeding compelling landlord to make required repairs.
  jurisdiction: NYC
  status: canonical
  aliases:
    - housing part action
    - HP proceeding
    - order to correct

- id: breach_warranty_habitability
  name: Breach of Warranty of Habitability
  description: Civil claim for rent abatement or damages where landlord fails to maintain habitable conditions.
  jurisdiction: NYS
  status: canonical
  aliases:
    - warranty of habitability breach
    - WOH

- id: harassment
  name: Landlord Harassment
  description: Landlord engages in conduct intended to force tenant out of rent-stabilized unit.
  jurisdiction: NYC
  status: canonical
  aliases:
    - tenant harassment
    - landlord harassment

- id: illegal_lockout
  name: Illegal Lockout
  description: Landlord unlawfully locks tenant out of their unit without a court order.
  jurisdiction: NYS
  status: canonical
  aliases:
    - unlawful lockout
    - lockout

- id: retaliatory_eviction
  name: Retaliatory Eviction
  description: Landlord retaliates against tenant for exercising a legal right (e.g., complaining to HPD, organizing).
  jurisdiction: NYS
  status: canonical
  aliases:
    - retaliation
    - retaliatory action

- id: security_deposit_return
  name: Security Deposit Return
  description: Landlord fails to return security deposit within the statutory deadline.
  jurisdiction: NYS
  status: canonical
  aliases:
    - deposit return
    - security deposit claim

- id: security_deposit_violation
  name: Security Deposit Violation
  description: Landlord violates rules governing collection, holding, or use of security deposits.
  jurisdiction: NYS
  status: canonical
  aliases:
    - deposit violation

- id: constructive_eviction
  name: Constructive Eviction
  description: Conditions are so severe that the tenant is effectively forced to vacate.
  jurisdiction: NYS
  status: canonical
  aliases:
    - constructive eviction claim

- id: housing_discrimination
  name: Housing Discrimination
  description: Discrimination in housing based on protected class (race, national origin, disability, source of income, etc.).
  jurisdiction: NYC
  status: canonical
  aliases:
    - discrimination
    - fair housing violation

- id: improper_service
  name: Improper Service
  description: Legal papers were not served in compliance with statutory requirements.
  jurisdiction: NYS
  status: canonical
  aliases:
    - defective service
    - service of process defect
    - improper service defense

- id: procedural_defect
  name: Procedural Defect
  description: A procedural error that may invalidate a legal proceeding (e.g., improper predicate notice).
  jurisdiction: NYS
  status: canonical
  aliases:
    - defective notice
    - procedural challenge

- id: succession_rights
  name: Succession Rights
  description: Family member or co-occupant asserts right to succeed to a rent-stabilized lease after the named tenant vacates or dies.
  jurisdiction: NYC
  status: canonical
  aliases:
    - lease succession
    - succession claim
    - succession rights violation

- id: primary_residence_challenge
  name: Primary Residence Challenge
  description: Tenant contests landlord's claim that the unit is not tenant's primary residence.
  jurisdiction: NYC
  status: canonical
  aliases:
    - primary residence

- id: preferential_rent_dispute
  name: Preferential Rent Dispute
  description: Dispute over landlord's right to restore rent to the legal regulated rent after charging a preferential rate.
  jurisdiction: NYC
  status: canonical
  aliases:
    - preferential rent

- id: owner_use_eviction
  name: Owner-Use / Immediate Family Use
  description: Landlord seeks to recover unit for personal use or use by an immediate family member.
  jurisdiction: NYC
  status: canonical
  aliases:
    - owner occupancy
    - owner use eviction

- id: illegal_apartment
  name: Illegal Apartment
  description: Unit lacks required certificates of occupancy or is otherwise illegally converted.
  jurisdiction: NYC
  status: canonical
  aliases:
    - illegal conversion
    - no CO

- id: condo_coop_conversion
  name: Condo / Co-op Conversion
  description: Landlord converts building to condo or co-op while tenant claims protections under conversion plan.
  jurisdiction: NYC
  status: canonical
  aliases:
    - conversion eviction
    - non-eviction plan

- id: lead_paint_violation
  name: Lead Paint Violation
  description: Landlord fails to remediate lead paint hazards in units with children under 6.
  jurisdiction: NYC
  status: canonical
  aliases:
    - lead hazard
    - lead paint

- id: mci_challenge
  name: MCI Rent Increase Challenge
  description: Tenant challenges a Major Capital Improvement rent increase granted to landlord.
  jurisdiction: NYC
  status: canonical
  aliases:
    - MCI challenge
    - major capital improvement dispute

- id: iae_challenge
  name: IAE / IAI Rent Increase Challenge
  description: Tenant challenges an Individual Apartment Enhancement or Individual Apartment Improvement rent increase.
  jurisdiction: NYC
  status: canonical
  aliases:
    - IAI challenge
    - individual apartment improvement dispute

# --- bootstrap proposals (status: proposed) ---
- id: breach_of_lease
  name: Breach of Lease
  description: A claim that a landlord violated the terms of a lease agreement, such
    as failing to provide essential services or maintain the premises.
  jurisdiction: NYS
  status: proposed
  aliases:
  - Breach of Contract
  - Landlord Breach of Contract
- id: breach_of_quiet_enjoyment
  name: Breach of Quiet Enjoyment
  description: A claim that the landlord substantially interfered with the tenant's
    right to use and enjoy the rental property peacefully.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: challenge_rent_increase
  name: Challenge Rent Increase
  description: A claim that a rent-controlled tenant can challenge a landlord's application
    for a rent increase due to uncorrected violations or failure to provide essential
    services.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: criminal_harassment
  name: Criminal Harassment
  description: Conduct that impairs habitability, endangers safety or health, or causes
    physical injury to a tenant or third person. Intentionally harassing a rent-regulated
    tenant (threats, repeated interruption of services, or other conduct intended to
    force vacatur) is a specific instance of this offense under Penal Law § 241.05.
  jurisdiction: NYS
  status: proposed
  aliases:
    - harassment of a rent regulated tenant
- id: dhcr_determination_challenge
  name: DHCR Determination Challenge
  description: A claim challenging an order or determination issued by the New York
    State Division of Housing and Community Renewal.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: disability_ac_accommodation
  name: Disability Accommodation for Air Conditioning
  description: A claim that a landlord must reasonably accommodate a tenant's disability
    by allowing or facilitating air conditioning installation, including upgrading
    electrical systems, unless it causes undue hardship.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: disability_rent_increase_exemption
  name: Disability Rent Increase Exemption (DRIE)
  description: A claim for exemption from rent increases for qualifying tenants with
    disabilities in rent-controlled apartments.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: disability_or_elderly_protection
  name: Disability or Elderly Protection
  description: A claim that a disabled or elderly tenant can delay eviction by providing
    proof to the marshal, who must notify Adult Protective Services.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: domestic_violence_lease_termination
  name: Domestic Violence Lease Termination
  description: A right for tenants with a court order of protection to break a lease
    if safety is jeopardized, with ten days' notice.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: emergency_hp_action
  name: Emergency HP Action
  description: An expedited HP action filed when there are serious, dangerous conditions
    in the apartment requiring immediate court intervention.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: excessive_rent_increase
  name: Excessive Rent Increase
  description: A claim that a landlord has imposed an unjust or unreasonable rent
    increase beyond what is permitted under rent stabilization.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: failure_to_maintain_cooling
  name: Failure to Maintain Cooling System
  description: A claim that a landlord failed to maintain a cooling system that was
    present when the tenant moved in, potentially violating habitability or rent stabilization
    obligations.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: failure_to_maintain_services
  name: Failure to Maintain Services
  description: A claim that a landlord has failed to provide essential services or
    maintain the building in good repair, potentially affecting rent regulation.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: failure_to_provide_essential_services
  name: Failure to Provide Essential Services
  description: A claim that the landlord failed to provide heat, hot water, electricity,
    or other essential services required by law.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: failure_to_provide_reasonable_accommodation
  name: Failure to Provide Reasonable Accommodation
  description: Landlord's failure to provide reasonable accommodation to tenants with
    disabilities, which is a form of discrimination.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: failure_to_register
  name: Failure to Register Apartment
  description: A claim that the landlord failed to file required rent registration
    statements with DHCR, affecting rent stabilization status.
  jurisdiction: NYS
  status: proposed
  aliases:
  - Failure to Register Rent
  - Failure to Register as Rent Stabilized
- id: failure_to_renew_lease
  name: Failure to Renew Lease
  description: A claim that a landlord failed to offer a renewal lease to a rent-stabilized
    tenant, entitling the tenant to withhold rent increases.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: fair_housing_act_discrimination
  name: Fair Housing Act Discrimination
  description: Discrimination in the sale, rental, financing, or other housing-related
    transactions based on race, color, national origin, religion, sex, familial status,
    or disability.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: fair_market_rent_appeal
  name: Fair Market Rent Appeal
  description: A tenant's right to challenge the initial rent set at the start of
    rent stabilization, seeking a refund if the rent increased excessively.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: fraudulent_deregulation
  name: Fraudulent Deregulation
  description: A claim that a landlord improperly removed a unit from rent stabilization
    through fraud, such as false statements about vacancy or improvements.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: fraudulent_rent_registration
  name: Fraudulent Rent Registration
  description: A claim that a landlord knowingly filed false or misleading rent registration
    statements with DHCR to justify an illegal rent increase.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: group_hp_action
  name: Group HP Action
  description: A single HP action filed by multiple tenants in the same building against
    the landlord, addressing individual apartment issues and common areas.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: heat_violation
  name: Heat Violation
  description: A claim that a landlord failed to provide adequate heat during the
    required heating season, violating minimum temperature standards.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: hot_water_violation
  name: Hot Water Violation
  description: A claim that a landlord failed to supply hot water at the required
    minimum temperature during specified hours.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: illegal_eviction
  name: Illegal Eviction (Self-Help Eviction)
  description: A claim that the landlord removed the tenant from the premises without
    a court order or following proper legal procedures, such as by changing locks
    or removing belongings.
  jurisdiction: NYS
  status: proposed
  aliases:
  - Unlawful Self-Help Eviction
  - Unlawful Eviction
  - Wrongful Eviction
- id: illegal_eviction_roommate
  name: Illegal Eviction of Roommate
  description: A prime tenant cannot evict a roommate by changing locks or other self-help
    measures if the roommate has tenancy rights.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: illegal_rent_increase
  name: Illegal Rent Increase
  description: A claim that a landlord has raised rent beyond allowed limits, such
    as through false renovation claims or improper vacancy increases.
  jurisdiction: NYC
  status: proposed
  aliases:
  - Unlawful Rent Increase
- id: lease_violation
  name: Lease Violation
  description: A claim that a landlord failed to comply with lease terms or rent stabilization
    requirements regarding lease offers or renewals.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: military_lease_termination
  name: Military Lease Termination
  description: A right for tenants entering active military service to break a lease
    with proper notice.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: negligent_maintenance
  name: Negligent Maintenance
  description: A claim that the landlord negligently failed to repair or maintain
    the property, causing harm to the tenant.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: relocation_services_claim
  name: Relocation Services Claim
  description: A claim by a displaced tenant for relocation services such as information
    on vacant accommodations and registration facilities.
  jurisdiction: NYC
  status: proposed
  aliases:
  - Relocation Payment Claim
  - Unlawful Eviction Claim
- id: rent_abatement
  name: Rent Abatement
  description: A claim for reduction or refund of rent due to the landlord's failure
    to provide essential services or maintain habitable conditions.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: rent_freeze_and_reduction
  name: Rent Freeze and Reduction
  description: A claim that a rent-regulated tenant is entitled to a rent freeze or
    reduction if the landlord fails to provide essential services or make repairs.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: repair_neglect
  name: Repair Neglect
  description: A claim that a landlord failed to make necessary repairs to the rental
    unit or common areas, causing harm or inconvenience.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: retaliation_for_housing_court_action
  name: Retaliation for Prior Housing Court Action
  description: Unlawful for a building owner to refuse to rent to a tenant because
    of prior action against the tenant in Housing Court.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: senior_citizen_rent_increase_exemption
  name: Senior Citizen Rent Increase Exemption (SCRIE)
  description: A claim for exemption from rent increases for qualifying senior citizens
    in rent-controlled apartments.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: senior_lease_termination
  name: Senior Lease Termination
  description: A right for tenants aged 62 or older to break a lease under specific
    circumstances, such as relocation to senior housing or medical necessity.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: service_reduction
  name: Service Reduction
  description: A claim that a landlord decreased essential building or apartment services,
    violating rent stabilization obligations.
  jurisdiction: NYS
  status: proposed
  aliases: []
- id: tenant_rights_roommate
  name: Tenant Rights for Roommates
  description: A roommate who has lived in the unit for at least 30 days or has a
    signed rental agreement has tenancy rights and cannot be evicted without proper
    legal process.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: treble_damages
  name: Treble Damages
  description: A claim for three times the amount of an overcharge as a penalty for
    willful overcharging.
  jurisdiction: NYC
  status: proposed
  aliases: []
- id: unlawful_ac_fees
  name: Unlawful Air Conditioning Fees
  description: A claim that a landlord improperly charged or attempted to collect
    fees for air conditioning units, including fees not authorized by lease or waived
    by delay.
  jurisdiction: NYC
  status: proposed
  aliases: []
